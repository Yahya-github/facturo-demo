<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="company-name" content="{{COMPANY_NAME}}">
  <meta name="color-scheme" content="light dark">
  <title>Factures — {{COMPANY_NAME}}</title>
  <script src="/static/js/ui/theme.js?v=1"></script>
  <link rel="preload" href="/static/fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/css/tokens.css?v=1">
  <link rel="stylesheet" href="/static/css/base.css?v=1">
  <link rel="stylesheet" href="/static/css/components.css?v=1">
  <link rel="stylesheet" href="/static/css/components-overlays.css?v=1">
  <link rel="stylesheet" href="/static/css/motion.css?v=1">
  <link rel="stylesheet" href="/static/css/app.css?v=22">
  <link rel="stylesheet" href="/static/css/filters.css?v=2">
  <link rel="stylesheet" href="/static/css/payments.css?v=2">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="brand-mark" aria-hidden="true"><i data-icon="receipt"></i></span>
        <div class="brand-text">
          <h1>{{COMPANY_NAME}}</h1>
          <div class="brand-sub">Facturation</div>
        </div>
      </div>
      <nav class="sidebar-nav" aria-label="Navigation principale">
        <div class="nav-group">
          <div class="nav-group-label">Facturation</div>
          <button class="nav-btn active" data-page="home" onclick="navigate('home')">
            <i data-icon="layout-dashboard"></i>
            <span class="nav-label">Accueil</span>
          </button>
          <button class="nav-btn" data-page="clients" onclick="navigate('clients')">
            <i data-icon="users"></i>
            <span class="nav-label">Clients</span>
          </button>
          <button class="nav-btn" data-page="facture" onclick="newFacture()">
            <i data-icon="receipt"></i>
            <span class="nav-label">Nouvelle facture</span>
          </button>
          <button class="nav-btn" data-page="history" onclick="navigate('history')">
            <i data-icon="history"></i>
            <span class="nav-label">Historique</span>
          </button>
        </div>
        <div class="nav-group">
          <div class="nav-group-label">Documents</div>
          <button class="nav-btn" data-page="scans" onclick="openScans()">
            <i data-icon="scan-line"></i>
            <span class="nav-label">Factures scannées</span>
          </button>
          <button class="nav-btn" data-page="payments" onclick="openPayments()">
            <i data-icon="banknote"></i>
            <span class="nav-label">Paiements</span>
          </button>
        </div>
        <div class="nav-group">
          <div class="nav-group-label">Système</div>
          <button class="nav-btn" data-page="settings" onclick="navigate('settings')">
            <i data-icon="settings"></i>
            <span class="nav-label">Paramètres</span>
            <span class="nav-dot" id="update-dot" hidden title="Mise à jour disponible"></span>
          </button>
        </div>
      </nav>
      <div class="sidebar-footer">
        <div class="seg theme-toggle" id="theme-toggle" role="group" aria-label="Thème">
          <button type="button" class="seg-btn" data-theme-set="light" aria-label="Thème clair" title="Clair"></button>
          <button type="button" class="seg-btn" data-theme-set="dark" aria-label="Thème sombre" title="Sombre"></button>
          <button type="button" class="seg-btn" data-theme-set="system" aria-label="Thème du système" title="Système"></button>
        </div>
        <div class="sidebar-version" id="app-version">Facturo</div>
      </div>
    </aside>
    <main class="main-content" id="main-content">
      <div class="page page-loading">
        <div class="loading-spinner" style="width:32px;height:32px"></div>
      </div>
    </main>
  </div>
  <script src="/static/js/util.js?v=2"></script>
  <script src="/static/js/icons.js?v=2"></script>
  <script src="/static/js/core.js?v=3"></script>
  <script src="/static/js/home.js?v=2"></script>
  <script src="/static/js/clients.js?v=2"></script>
  <script src="/static/js/discounts.js?v=1"></script>
  <script src="/static/js/facture.js?v=2"></script>
  <script src="/static/js/history.js?v=3"></script>
  <script src="/static/js/scans.js?v=3"></script>
  <script src="/static/js/payments.js?v=2"></script>
  <script src="/static/js/settings.js?v=2x"></script>
  <script src="/static/js/autocomplete.js?v=1"></script>
  <script src="/static/js/boot.js?v=1"></script>
</body>
</html>

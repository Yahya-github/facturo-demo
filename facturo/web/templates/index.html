  <svg class="sprite" width="0" height="0" aria-hidden="true" focusable="false">
    <symbol id="brand-f" viewBox="0 0 32 32">
      <path d="M8 5H21L27 11V13H12V15H21V20H12V27H6V7A2 2 0 0 1 8 5Z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M21 5L27 11H21Z" fill="#d4a853"/>
      <circle cx="24.6" cy="24" r="2.4" fill="#d4a853"/>
    </symbol>
  </svg>
  <a class="skip-link" href="#main-content" id="skip-link" data-i18n="a11y.skip_link">Aller au contenu</a>
  <div class="app-backdrop" id="app-backdrop" aria-hidden="true"></div>
  <div class="app-shell">
    <nav class="mobile-bar" aria-label="Barre mobile" data-i18n-attr="aria-label:a11y.mobile_bar">
      <button type="button" class="btn btn-ghost btn-icon" id="sidebar-open" data-sidebar-toggle aria-label="Ouvrir le menu" data-i18n-attr="aria-label:a11y.open_menu" aria-haspopup="dialog"><i data-icon="menu"></i></button>
      <span class="brand brand-compact" role="img" aria-label="Facturo"><svg class="brand-mark" aria-hidden="true"><use href="#brand-f"/></svg><span class="brand-word">Facturo</span></span>
      <button type="button" class="btn btn-ghost btn-icon" data-cmd-open aria-label="Rechercher" data-i18n-attr="aria-label:a11y.search"><i data-icon="search"></i></button>
    </nav>
    <aside class="sidebar" id="sidebar" aria-label="Barre latérale" data-i18n-attr="aria-label:a11y.sidebar">
      <div class="sidebar-brand">
        <div class="brand" role="img" aria-label="Facturo"><svg class="brand-mark" aria-hidden="true"><use href="#brand-f"/></svg><span class="brand-word">Facturo</span></div>
      </div>
      <div class="ws">
        <button type="button" class="ws-switch" id="ws-switch" aria-haspopup="menu" title="{{COMPANY_NAME}}">
          <span class="ws-avatar" id="ws-avatar" aria-hidden="true"></span>
          <span class="ws-text">
            <span class="ws-name">{{COMPANY_NAME}}</span>
            <span class="ws-sub" data-i18n="ws.workspace">Espace de travail</span>
          </span>
          <i data-icon="chevrons-up-down" data-icon-size="sm"></i>
        </button>
      </div>
      <nav class="sidebar-nav" aria-label="Navigation principale" data-i18n-attr="aria-label:a11y.main_nav">
        <div class="nav-group">
          <div class="nav-group-label" data-i18n="nav.group.billing">Facturation</div>
          <button class="nav-btn active" data-page="home" onclick="navigate('home')">
            <i data-icon="layout-dashboard"></i>
            <span class="nav-label" data-i18n="nav.home">Accueil</span>
          </button>
          <button class="nav-btn" data-page="clients" onclick="navigate('clients')">
            <i data-icon="users"></i>
            <span class="nav-label" data-i18n="nav.clients">Clients</span>
          </button>
          <button class="nav-btn" data-page="facture" onclick="newFacture()">
            <i data-icon="receipt"></i>
            <span class="nav-label" data-i18n="nav.facture">Nouvelle facture</span>
          </button>
          <button class="nav-btn" data-page="history" onclick="navigate('history')">
            <i data-icon="history"></i>
            <span class="nav-label" data-i18n="nav.history">Historique</span>
          </button>
        </div>
        <div class="nav-group">
          <div class="nav-group-label" data-i18n="nav.group.documents">Documents</div>
          <button class="nav-btn" data-page="scans" onclick="openScans()">
            <i data-icon="scan-line"></i>
            <span class="nav-label" data-i18n="nav.scans">Factures scannées</span>
          </button>
          <button class="nav-btn" data-page="payments" onclick="openPayments()">
            <i data-icon="banknote"></i>
            <span class="nav-label" data-i18n="nav.payments">Paiements</span>
          </button>
        </div>
        <div class="nav-group">
          <div class="nav-group-label" data-i18n="nav.group.system">Système</div>
          <button class="nav-btn" data-page="settings" onclick="navigate('settings')">
            <i data-icon="settings"></i>
            <span class="nav-label" data-i18n="nav.settings">Paramètres</span>
            <span class="nav-dot" id="update-dot" hidden title="Mise à jour disponible" data-i18n-attr="data-tip:update.available"></span>
          </button>
        </div>
      </nav>
      <div class="sidebar-footer">
        <div class="seg theme-toggle" id="theme-toggle" role="group" aria-label="Thème" data-i18n-attr="aria-label:theme.group">
          <button type="button" class="seg-btn" data-theme-set="light" aria-label="Thème clair" title="Clair" data-i18n-attr="aria-label:theme.light,data-tip:theme.light_short"></button>
          <button type="button" class="seg-btn" data-theme-set="dark" aria-label="Thème sombre" title="Sombre" data-i18n-attr="aria-label:theme.dark,data-tip:theme.dark_short"></button>
          <button type="button" class="seg-btn" data-theme-set="system" aria-label="Thème du système" title="Système" data-i18n-attr="aria-label:theme.system,data-tip:theme.system_short"></button>
        </div>
        <div class="sidebar-version" id="app-version">Facturo</div>
      </div>
    </aside>
    <div class="inset" id="inset">
      <header class="topbar">
        <button type="button" class="btn btn-ghost btn-icon topbar-toggle" id="sidebar-toggle" data-sidebar-toggle
          data-tip="Réduire le menu" data-tip-side="bottom" data-kbd="Ctrl+B"
          aria-label="Réduire le menu" aria-expanded="true" aria-controls="sidebar"
          data-i18n-attr="data-tip:sidebar.collapse,aria-label:sidebar.collapse"><i data-icon="panel-left"></i></button>
        <span class="topbar-sep" aria-hidden="true"></span>
        <h1 class="sr-only" id="page-title"></h1>
        <nav class="breadcrumb" id="breadcrumb" aria-label="Fil d'Ariane" data-i18n-attr="aria-label:a11y.breadcrumb"></nav>
        <div class="topbar-actions">
          <button type="button" class="topbar-search" data-cmd-open aria-keyshortcuts="Control+K Meta+K">
            <i data-icon="search" data-icon-size="sm"></i>
            <span class="topbar-search-label" data-i18n="search.placeholder">Rechercher…</span>
            <span class="topbar-search-kbd" aria-hidden="true"><kbd>Ctrl</kbd><kbd>K</kbd></span>
          </button>
          <button type="button" class="btn btn-ghost btn-icon topbar-bell" id="topbar-bell" hidden aria-label="Mise à jour disponible" data-tip="Mise à jour disponible" data-i18n-attr="aria-label:update.available,data-tip:update.available"><i data-icon="bell"></i><span class="topbar-bell-dot" aria-hidden="true"></span></button>
          <div class="seg seg-labeled" id="lang-toggle" role="group" aria-label="Langue" data-lang-group data-i18n-attr="aria-label:lang.group">
            <button type="button" class="seg-btn" data-lang-set="en" aria-pressed="true" aria-label="Anglais" title="Anglais" data-i18n-attr="aria-label:lang.en,data-tip:lang.en">EN</button>
            <button type="button" class="seg-btn" data-lang-set="fr" aria-pressed="false" aria-label="Français" title="Français" data-i18n-attr="aria-label:lang.fr,data-tip:lang.fr">FR</button>
          </div>
          <button type="button" class="btn btn-ghost btn-icon" id="theme-cycle" aria-label="Changer de thème" data-tip="Changer de thème" data-i18n-attr="aria-label:theme.toggle,data-tip:theme.toggle"></button>
        </div>
      </header>
      <main class="main-content" id="main-content" tabindex="-1">
        <div class="page page-loading">
          <div class="loading-spinner" style="width:32px;height:32px"></div>
        </div>
      </main>
    </div>

[project]
name = "facturo"
description = "Local-first invoicing for a trucking company: billet scans, AI extraction, Excel invoices, payment matching"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yahya-github" }]
requires-python = ">=3.11"
dynamic = ["version"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
# The invoice template's header/footer string is valid Excel that openpyxl cannot round-trip.
filterwarnings = ["ignore:Cannot parse header or footer:UserWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["data", "dist", "venv", "build_venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008"]

[tool.coverage.run]
source = ["facturo"]
